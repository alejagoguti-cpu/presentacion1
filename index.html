        links: [[0,1],[0,2],[0,5],[1,2],[1,3],[2,3],[1,4],[2,4],[3,4],[0,4]]
      },
      {
        num: 62,
        title: "Gracias por ver",
        subtitle: "Investigación desarrollada por Alejandra Gómez • Ana Casas • Juan Trujillo",
        category: "Colofón Final",
        accent: "#0284c7",
        rgb: [2, 132, 199],
        label: "Red Síntesis: Topología Final del Poder Urbano",
        nodes: [
          { id: 0, x: -130, y: -50, z: 20, r: 13, label: "Hong Kong", desc: "Common Law, 4 pilares y confinamiento insular." },
          { id: 1, x: 130, y: -50, z: -20, r: 13, label: "Shenzhen", desc: "Estado-corporativo, 20 clústeres y ChiNext." },
          { id: 2, x: 0, y: -110, z: 30, r: 11, label: "Çatalhöyük", desc: "Malla celular continua de 7500 a.C." },
          { id: 3, x: 0, y: 60, z: 0, r: 14, label: "Bogotá (Kennedy & Corabastos)", desc: "Autoorganización, interfaz con JAC y red agroalimentaria." },
          { id: 4, x: 0, y: 130, z: -30, r: 11, label: "Autoría Colectiva", desc: "Alejandra Gómez • Ana Casas • Juan Trujillo." }
        ],
        links: [[0,1],[0,2],[1,2],[0,3],[1,3],[2,3],[3,4]]
      }
    ];

    // ==========================================================================
    // 2. RENDERIZADO DEL STREAM ROLL-UP CON LAS 62 REDES
    // ==========================================================================
    const streamContainer = document.getElementById('streamContainer');
    const slideSelector = document.getElementById('slideSelector');

    function renderStream() {
      let streamHtml = '';
      let optionsHtml = '';

      SECTIONS.forEach((s, idx) => {
        optionsHtml += `<option value="${s.num}">Slide ${String(s.num).padStart(2, '0')}: ${s.title}</option>`;

        streamHtml += `
          <section class="section-beat-card" id="slide-${s.num}">
            <div class="beat-meta-row">
              <div class="beat-slide-num" style="color: ${s.accent};">
                <span class="dot" style="background: ${s.accent};"></span>
                Slide ${String(s.num).padStart(2, '0')}
              </div>
              <div>${s.category}</div>
            </div>

            <h2 class="beat-title">${s.title}</h2>
            <p class="beat-subtitle">${s.subtitle}</p>

            <div class="network-stage-frame">
              <div class="stage-bar">
                <div class="stage-label" style="color: ${s.accent};">✦ ${s.label}</div>
                <div class="stage-controls">
                  <button class="stage-btn" onclick="triggerPulse(${idx})">⚡ Pulso</button>
                  <button class="stage-btn" onclick="toggleAuto(${idx}, this)">🌀 Órbita</button>
                  <button class="stage-btn" onclick="resetNodes(${idx})">⟲ Reset</button>
                </div>
              </div>
              <div class="canvas-box" id="viewBox${idx}">
                <canvas id="canvas${idx}"></canvas>
                <div class="canvas-note">🖱️ Rotar 360° • Arrastrar Nodos con física • Clic en nodo para ver detalles</div>
                <div class="canvas-inspector" id="inspect${idx}">
                  <div class="inspector-title" id="inspectTitle${idx}" style="color: ${s.accent};">Nodo</div>
                  <div id="inspectDesc${idx}" style="color: var(--text-muted);">Detalles.</div>
                </div>
              </div>
            </div>
          </section>
        `;
      });

      // Colofón final
      streamHtml += `
        <footer class="colophon-sec">
          <blockquote class="colophon-quote">
            «Pensar la densidad no es contar rascacielos; es comprender la arquitectura y sus redes como la capacidad viva de una sociedad para negociar su propio destino en el espacio.»
          </blockquote>
          <div class="colophon-card">
            <div style="font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.12em; color: var(--accent-hk); text-transform: uppercase; margin-bottom: 4px; font-weight: 600;">Autoría Colectiva & Sustentación</div>
            <div style="font-weight: 700; font-size: 1.15rem; color: var(--text-main);">Alejandra Gómez • Ana Casas • Juan Trujillo</div>
          </div>
        </footer>
      `;

      streamContainer.innerHTML = streamHtml;
      slideSelector.innerHTML = optionsHtml;
    }

    renderStream();

    // ==========================================================================
    // 3. MOTOR TOPOLÓGICO 3D DE ALTO RENDIMIENTO (62 STAGES CON OBSERVER)
    // ==========================================================================
    class StageEngine {
      constructor(idx) {
        this.idx = idx;
        this.canvas = document.getElementById(`canvas${idx}`);
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        this.data = JSON.parse(JSON.stringify(SECTIONS[idx]));
        this.rgb = SECTIONS[idx].rgb;
        this.angleX = 0.2;
        this.angleY = 0.3 + idx * 0.15;
        this.autoRotate = true;
        this.isDraggingBg = false;
        this.draggedNode = null;
        this.hoveredNode = null;
        this.shockwaves = [];
        this.lastMouse = { x: 0, y: 0 };
        this.isActiveInViewport = false;
        this.inspector = document.getElementById(`inspect${idx}`);
        this.inspectTitle = document.getElementById(`inspectTitle${idx}`);
        this.inspectDesc = document.getElementById(`inspectDesc${idx}`);

        this.initEvents();
        this.resize();
      }

      resize() {
        const box = this.canvas.parentElement;
        this.width = box.clientWidth || 800;
        this.height = box.clientHeight || 420;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.canvas.width = Math.floor(this.width * dpr);
        this.canvas.height = Math.floor(this.height * dpr);
        this.ctx.setTransform(1, 0, 0, 1, 0, 0);
        this.ctx.scale(dpr, dpr);
      }

      initEvents() {
        window.addEventListener('resize', () => this.resize());

        this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
        window.addEventListener('mousemove', (e) => this.onMouseMove(e));
        window.addEventListener('mouseup', () => this.onMouseUp());
        this.canvas.addEventListener('click', (e) => this.onClick(e));
      }

      project(p) {
        const cosY = Math.cos(this.angleY), sinY = Math.sin(this.angleY);
        const x1 = p.x * cosY - p.z * sinY;
        const z1 = p.z * cosY + p.x * sinY;

        const cosX = Math.cos(this.angleX), sinX = Math.sin(this.angleX);
        const y2 = p.y * cosX - z1 * sinX;
        const z2 = z1 * cosX + p.y * sinX;

        const fov = 420;
        const scale = fov / (fov + z2);
        return {
          x: this.width / 2 + x1 * scale,
          y: this.height / 2 + y2 * scale,
          scale: Math.max(0.2, scale),
          z2: z2
        };
      }

      getNodeUnderCursor(mx, my) {
        let best = null;
        let minDist = 22;
        this.data.nodes.forEach(n => {
          const proj = this.project(n);
          const dist = Math.hypot(proj.x - mx, proj.y - my);
          if (dist < n.r * proj.scale + 10 && dist < minDist) {
            minDist = dist;
            best = n;
          }
        });
        return best;
      }

      onMouseDown(e) {
        const rect = this.canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        const targetNode = this.getNodeUnderCursor(mx, my);
        if (targetNode) {
          this.draggedNode = targetNode;
        } else {
          this.isDraggingBg = true;
          this.lastMouse = { x: e.clientX, y: e.clientY };
        }
      }

      onMouseMove(e) {
        const rect = this.canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        if (this.draggedNode) {
          const cosY = Math.cos(-this.angleY), sinY = Math.sin(-this.angleY);
          const dx = (mx - this.width / 2) * 1.5;
          const dy = (my - this.height / 2) * 1.5;
          this.draggedNode.x = dx * cosY - 0 * sinY;
          this.draggedNode.y = dy;
          this.draggedNode.z = 0 * cosY + dx * sinY;
          return;
        }

        if (this.isDraggingBg) {
          const dx = e.clientX - this.lastMouse.x;
          const dy = e.clientY - this.lastMouse.y;
          this.angleY += dx * 0.007;
          this.angleX -= dy * 0.007;
          this.lastMouse = { x: e.clientX, y: e.clientY };
        } else {
          const node = this.getNodeUnderCursor(mx, my);
          this.hoveredNode = node;
          if (node) {
            this.showInspector(node);
          } else if (!this.pinnedNode) {
            this.hideInspector();
          }
        }
      }

      onMouseUp() {
        this.isDraggingBg = false;
        this.draggedNode = null;
      }

      onClick(e) {
        const rect = this.canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const node = this.getNodeUnderCursor(mx, my);

        if (node) {
          this.pinnedNode = node;
          this.showInspector(node);
          this.triggerPulse();
        } else {
          this.pinnedNode = null;
          this.hideInspector();
        }
      }

      showInspector(node) {
        if (!this.inspector) return;
        this.inspectTitle.textContent = node.label;
        this.inspectDesc.textContent = node.desc;
        this.inspector.classList.add('show');
      }

      hideInspector() {
        if (!this.inspector) return;
        this.inspector.classList.remove('show');
      }

      triggerPulse() {
        this.shockwaves.push({ radius: 5, maxRadius: 280, alpha: 1 });
      }

      resetNodes() {
        this.data = JSON.parse(JSON.stringify(SECTIONS[this.idx]));
        this.shockwaves = [];
      }

      render() {
        if (this.autoRotate && !this.isDraggingBg && !this.draggedNode) {
          this.angleY += 0.005;
        }

        this.ctx.clearRect(0, 0, this.width, this.height);

        // Ondas de choque
        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const sw = this.shockwaves[i];
          sw.radius += 5;
          sw.alpha *= 0.94;

          this.ctx.beginPath();
          this.ctx.arc(this.width / 2, this.height / 2, sw.radius, 0, Math.PI * 2);
          this.ctx.strokeStyle = `rgba(${this.rgb[0]}, ${this.rgb[1]}, ${this.rgb[2]}, ${sw.alpha * 0.5})`;
          this.ctx.lineWidth = 2;
          this.ctx.stroke();

          if (sw.alpha < 0.02) this.shockwaves.splice(i, 1);
        }

        // Aristas
        this.data.links.forEach(([i, j]) => {
          const n1 = this.data.nodes[i];
          const n2 = this.data.nodes[j];
          if (!n1 || !n2) return;

          const p1 = this.project(n1);
          const p2 = this.project(n2);

          const isConnected = (this.hoveredNode && (this.hoveredNode.id === n1.id || this.hoveredNode.id === n2.id));

          this.ctx.beginPath();
          this.ctx.moveTo(p1.x, p1.y);
          this.ctx.lineTo(p2.x, p2.y);

          if (isConnected) {
            this.ctx.strokeStyle = `rgba(${this.rgb[0]}, ${this.rgb[1]}, ${this.rgb[2]}, 0.85)`;
            this.ctx.lineWidth = 2.5;
          } else {
            this.ctx.strokeStyle = `rgba(${this.rgb[0]}, ${this.rgb[1]}, ${this.rgb[2]}, 0.22)`;
            this.ctx.lineWidth = 1;
          }
          this.ctx.stroke();
        });

        // Nodos
        const sorted = [...this.data.nodes].map(n => ({ node: n, proj: this.project(n) }))
          .sort((a, b) => a.proj.z2 - b.proj.z2);

        sorted.forEach(({ node, proj }) => {
          const isHovered = this.hoveredNode && this.hoveredNode.id === node.id;
          const r = node.r * proj.scale * (isHovered ? 1.35 : 1);

          this.ctx.beginPath();
          this.ctx.arc(proj.x, proj.y, r * 1.8, 0, Math.PI * 2);
          this.ctx.fillStyle = `rgba(${this.rgb[0]}, ${this.rgb[1]}, ${this.rgb[2]}, ${isHovered ? 0.25 : 0.08})`;
          this.ctx.fill();

          this.ctx.beginPath();
          this.ctx.arc(proj.x, proj.y, r, 0, Math.PI * 2);
          const grad = this.ctx.createRadialGradient(
            proj.x - r * 0.3, proj.y - r * 0.3, r * 0.1,
            proj.x, proj.y, r
          );
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.5, `rgb(${this.rgb[0]}, ${this.rgb[1]}, ${this.rgb[2]})`);
          grad.addColorStop(1, `rgba(${this.rgb[0] * 0.6}, ${this.rgb[1] * 0.6}, ${this.rgb[2] * 0.6}, 1)`);
          this.ctx.fillStyle = grad;
          this.ctx.fill();

          this.ctx.font = `${Math.max(10, Math.floor(12 * proj.scale))}px "Space Grotesk", sans-serif`;
          this.ctx.fillStyle = isHovered ? '#0c121e' : '#5a6a85';
          this.ctx.textAlign = 'center';
          this.ctx.fillText(node.label, proj.x, proj.y + r + 13 * proj.scale);
        });
      }
    }

    const ENGINES = [];
    window.addEventListener('DOMContentLoaded', () => {
      for (let i = 0; i < 62; i++) {
        ENGINES.push(new StageEngine(i));
      }

      // Intersection Observer para animar solo los visibles a 60 FPS
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const idx = parseInt(entry.target.getAttribute('data-idx'));
          if (!isNaN(idx) && ENGINES[idx]) {
            ENGINES[idx].isActiveInViewport = entry.isIntersecting;
          }
        });
      }, { rootMargin: '100px' });

      for (let i = 0; i < 62; i++) {
        const box = document.getElementById(`viewBox${i}`);
        if (box) {
          box.setAttribute('data-idx', i);
          observer.observe(box);
        }
      }

      function mainLoop() {
        ENGINES.forEach(eng => {
          if (eng && eng.isActiveInViewport) eng.render();
        });
        requestAnimationFrame(mainLoop);
      }
      mainLoop();
    });

    function triggerPulse(idx) {
      if (ENGINES[idx]) ENGINES[idx].triggerPulse();
    }

    function toggleAuto(idx, btn) {
      if (ENGINES[idx]) {
        ENGINES[idx].autoRotate = !ENGINES[idx].autoRotate;
        if (btn) btn.classList.toggle('active', ENGINES[idx].autoRotate);
      }
    }

    function resetNodes(idx) {
      if (ENGINES[idx]) ENGINES[idx].resetNodes();
    }

    // ==========================================================================
    // 4. CONTROL DE NAVEGACIÓN ENTRE LAS 62 SECCIONES
    // ==========================================================================
    let currentSlide = 1;

    function updateProgress() {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const progress = (scrollTop / scrollHeight) * 100;
      document.getElementById('progressBar').style.width = `${progress}%`;

      for (let i = 1; i <= 62; i++) {
        const el = document.getElementById(`slide-${i}`);
        if (el) {
          const rect = el.getBoundingClientRect();
          if (rect.top <= window.innerHeight * 0.45 && rect.bottom >= window.innerHeight * 0.2) {
            currentSlide = i;
            document.getElementById('slideSelector').value = i;
            break;
          }
        }
      }
    }

    window.addEventListener('scroll', updateProgress, { passive: true });

    function jumpToSlide(num) {
      const target = document.getElementById(`slide-${num}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function prevSlide() {
      if (currentSlide > 1) jumpToSlide(currentSlide - 1);
    }

    function nextSlide() {
      if (currentSlide < 62) jumpToSlide(currentSlide + 1);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
    });
  </script>
</body>
