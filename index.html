      --text-muted: #5a6a85;
      --text-faint: #94a3b8;

      --accent-ct: #d97706;
      --accent-bg: #059669;
      --accent-alert: #e11d48;
      
      --border-delicate: rgba(15, 23, 42, 0.08);
      
      --font-serif: "Playfair Display", Georgia, serif;
      --font-sans: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "DM Mono", monospace;
    }

    *, *::before, *::after {

      margin: 0;
      padding: 0;
    }

    html {

      background-color: var(--bg-pure);
      color: var(--text-main);

      font-size: 1rem;
      line-height: 1.6;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

       ========================================================================== */

      top: 0;
      left: 0;
      width: 100%;
      height: 56px;
      padding: 0 4vw;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-delicate);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .arch-badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--text-main);
      background: var(--bg-subtle);
      border: 1px solid var(--border-delicate);
      padding: 3px 8px;
      border-radius: 4px;
    }

    .authors-title {
      font-family: var(--font-sans);
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--font-mono);
      font-size: 0.76rem;
    }

    .slide-badge {
      font-weight: 600;
      color: var(--accent-hk);
      background: rgba(2, 132, 199, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(2, 132, 199, 0.2);
    }

    .nav-arrow {
      background: #ffffff;
      border: 1px solid var(--border-delicate);
      color: var(--text-main);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-arrow:hover {
      border-color: var(--accent-hk);
      color: var(--accent-hk);
    }

    .progress-bar-line {
      position: fixed;
      top: 55px;
      left: 0;
      height: 2px;
      width: 0%;
      background: var(--accent-hk);
      z-index: 1001;
      transition: width 0.1s ease-out;
    }

    /* ==========================================================================
       ROLL-UP ARQUITECTÓNICO LINEAL (SLIDE 1 A 62)
       ========================================================================== */
    .arch-stream {
      max-width: 1080px;
      margin: 0 auto;
      padding: 80px 1.5rem 8rem;
    }

    .arch-slide-block {
      padding: 3.5rem 0 4rem;
      border-bottom: 1px solid var(--border-delicate);
      position: relative;
    }

    .arch-slide-block:last-child {
      border-bottom: none;
    }

    .slide-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .slide-num-tag {
      font-weight: 600;
      color: var(--accent-hk);
    }

    .slide-heading {
      font-family: var(--font-serif);
      font-size: clamp(1.6rem, 2.8vw, 2.2rem);
      font-weight: 600;
      line-height: 1.25;
      color: var(--text-main);
      margin-bottom: 0.6rem;
    }

    .slide-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-bottom: 1.5rem;
      max-width: 900px;
    }

    .slide-subtitle strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .arch-plate-frame {
      border-radius: 8px;
      overflow: hidden;
      background: #f8fafc;
      border: 1px solid var(--border-delicate);
      box-shadow: 0 4px 20px -4px rgba(15, 23, 42, 0.06);
      cursor: zoom-in;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .arch-plate-frame:hover {
      box-shadow: 0 12px 30px -6px rgba(2, 132, 199, 0.15);
      transform: translateY(-2px);
    }

    .arch-plate-frame img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

       CANVAS 3D INTERACTIVOS INTEGRADOS EN SUS MOMENTOS EXACTOS
       ========================================================================== */
    .network-stage-frame {
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid var(--border-delicate);
      box-shadow: 0 4px 20px -4px rgba(15, 23, 42, 0.05);
      overflow: hidden;
      margin-top: 1.5rem;
    }

    .stage-bar {
      padding: 0.6rem 1rem;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-delicate);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .stage-label {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stage-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .speed-box {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
      background: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-delicate);
    }

    .speed-range {
      -webkit-appearance: none;
      appearance: none;
      width: 60px;
      height: 3px;
      border-radius: 999px;
      background: #e2e8f0;
      outline: none;
    }

    .speed-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-hk);
      cursor: pointer;
    }

    .stage-btn {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: #ffffff;
      border: 1px solid var(--border-delicate);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .stage-btn:hover {
      border-color: var(--accent-hk);
      color: var(--accent-hk);
    }

    .stage-btn.active {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    .canvas-box {
      position: relative;
      width: 100%;
      height: 420px;
      background: radial-gradient(circle at center, #ffffff 40%, #f8fafc 100%);
      cursor: grab;
      overflow: hidden;
      user-select: none;
    }

    .canvas-box:active { cursor: grabbing; }

    .canvas-box canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .canvas-note {
      position: absolute;
      bottom: 8px;
      left: 10px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-faint);
      background: rgba(255, 255, 255, 0.9);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-delicate);
      pointer-events: none;

    .canvas-inspector {
      position: absolute;
      top: 10px;
      right: 10px;
      max-width: 280px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-delicate);
      border-radius: 8px;
      padding: 8px 12px;

      line-height: 1.45;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-4px);
      transition: all 0.2s ease;

      opacity: 1;
      transform: translateY(0);

      font-family: var(--font-mono);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;

      left: 0;

      height: 100vh;
      background: rgba(12, 18, 30, 0.95);
      backdrop-filter: blur(16px);

      display: none;
      align-items: center;
      justify-content: center;
      padding: 3vw;
      opacity: 0;
      transition: opacity 0.2s ease;

    .lightbox-wrap.active {

      opacity: 1;
    }

    .lightbox-content {

      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;

      max-height: 82vh;

      border-radius: 4px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      color: #e2e8f0;

    .lightbox-close {
      position: absolute;
      top: -36px;
      right: 0;
      background: none;
      border: none;
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 1.5rem;

      font-family: var(--font-serif);
      font-size: 1.3rem;
      font-style: italic;
      line-height: 1.6;
      color: var(--text-main);

    .colophon-card {
      padding: 1rem 2rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-delicate);
      border-radius: 8px;

</head>

    let currentSlide = 1;

    function updateProgress() {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const progress = (scrollTop / scrollHeight) * 100;
      document.getElementById('progressBar').style.width = `${progress}%`;

      for (let i = 1; i <= 62; i++) {
        const el = document.getElementById(`slide-${i}`);
        if (el) {
          const rect = el.getBoundingClientRect();
          if (rect.top <= window.innerHeight * 0.45 && rect.bottom >= window.innerHeight * 0.2) {
            currentSlide = i;
            document.getElementById('slideBadge').textContent = `${String(i).padStart(2, '0')} / 62`;
            break;
          }
        }
      }
    }

    window.addEventListener('scroll', updateProgress, { passive: true });

    function goToSlide(num) {
      const target = document.getElementById(`slide-${num}`);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function prevSlide() {
      if (currentSlide > 1) goToSlide(currentSlide - 1);
    }

    function nextSlide() {
      if (currentSlide < 62) goToSlide(currentSlide + 1);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') nextSlide();
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
      else if (e.key === 'Escape') closeFullPlate();
    });

    class InteractiveStage {
      constructor(idx) {
        this.idx = idx;
        this.canvas = document.getElementById(`stageCanvas${idx}`);
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        this.data = JSON.parse(JSON.stringify(TOPOLOGIES[idx]));
        this.rgb = TOPOLOGIES[idx].accentRgb;
        this.angleX = 0.2;
        this.angleY = 0.3 + idx * 0.4;
        this.autoRotate = true;
        this.speed = 1.0;
        this.isDraggingBg = false;
        this.draggedNode = null;
        this.hoveredNode = null;
        this.shockwaves = [];
        this.lastMouse = { x: 0, y: 0 };
        this.inspector = document.getElementById(`inspect${idx}`);
        this.inspectTitle = document.getElementById(`inspectTitle${idx}`);
        this.inspectDesc = document.getElementById(`inspectDesc${idx}`);

        this.initEvents();
        this.resize();
        this.animate();
      }

      resize() {
        const box = this.canvas.parentElement;
        this.width = box.clientWidth || 800;
        this.height = box.clientHeight || 420;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.canvas.width = Math.floor(this.width * dpr);
        this.canvas.height = Math.floor(this.height * dpr);
        this.ctx.setTransform(1, 0, 0, 1, 0, 0);
        this.ctx.scale(dpr, dpr);
      }

      initEvents() {
        window.addEventListener('resize', () => this.resize());

        const speedEl = document.getElementById(`speed${this.idx}`);
        const speedValEl = document.getElementById(`speedVal${this.idx}`);
        if (speedEl) {
          speedEl.addEventListener('input', (e) => {
            this.speed = parseFloat(e.target.value);
            if (speedValEl) speedValEl.textContent = `${this.speed.toFixed(1)}x`;
          });
        }

        this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
        window.addEventListener('mousemove', (e) => this.onMouseMove(e));
        window.addEventListener('mouseup', () => this.onMouseUp());
        this.canvas.addEventListener('click', (e) => this.onClick(e));
      }

      project(p) {
        const cosY = Math.cos(this.angleY), sinY = Math.sin(this.angleY);
        const x1 = p.x * cosY - p.z * sinY;
        const z1 = p.z * cosY + p.x * sinY;

        const cosX = Math.cos(this.angleX), sinX = Math.sin(this.angleX);
        const y2 = p.y * cosX - z1 * sinX;
        const z2 = z1 * cosX + p.y * sinX;

        const fov = 420;
        const scale = fov / (fov + z2);
        return {
          x: this.width / 2 + x1 * scale,
          y: this.height / 2 + y2 * scale,
          scale: Math.max(0.2, scale),
          z2: z2
        };
      }

      getNodeUnderCursor(mx, my) {
        let best = null;
        let minDist = 22;
        this.data.nodes.forEach(n => {
          const proj = this.project(n);
          const dist = Math.hypot(proj.x - mx, proj.y - my);
          if (dist < n.r * proj.scale + 10 && dist < minDist) {
            minDist = dist;
            best = n;
          }
        });
        return best;
      }

      onMouseDown(e) {
        const rect = this.canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        const targetNode = this.getNodeUnderCursor(mx, my);
        if (targetNode) {
          this.draggedNode = targetNode;
        } else {
          this.isDraggingBg = true;
          this.lastMouse = { x: e.clientX, y: e.clientY };
        }
      }

      onMouseMove(e) {
        const rect = this.canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        if (this.draggedNode) {
          const cosY = Math.cos(-this.angleY), sinY = Math.sin(-this.angleY);
          const dx = (mx - this.width / 2) * 1.5;
          const dy = (my - this.height / 2) * 1.5;
          this.draggedNode.x = dx * cosY - 0 * sinY;
          this.draggedNode.y = dy;
          this.draggedNode.z = 0 * cosY + dx * sinY;
          return;
        }

        if (this.isDraggingBg) {
          const dx = e.clientX - this.lastMouse.x;
          const dy = e.clientY - this.lastMouse.y;
          this.angleY += dx * 0.007;
          this.angleX -= dy * 0.007;
          this.lastMouse = { x: e.clientX, y: e.clientY };
        } else {
          const node = this.getNodeUnderCursor(mx, my);
          this.hoveredNode = node;
          if (node) {
            this.showInspector(node);
          } else if (!this.pinnedNode) {
            this.hideInspector();
          }
        }
      }

      onMouseUp() {
        this.isDraggingBg = false;
        this.draggedNode = null;
      }

      onClick(e) {
        const rect = this.canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const node = this.getNodeUnderCursor(mx, my);

        if (node) {
          this.pinnedNode = node;
          this.showInspector(node);
          this.triggerPulse();
        } else {
          this.pinnedNode = null;
          this.hideInspector();
        }
      }

      showInspector(node) {
        if (!this.inspector) return;
        this.inspectTitle.textContent = node.label;
        this.inspectDesc.textContent = node.desc;
        this.inspector.classList.add('show');
      }

      hideInspector() {
        if (!this.inspector) return;
        this.inspector.classList.remove('show');
      }

      triggerPulse() {
        this.shockwaves.push({ radius: 5, maxRadius: 280, alpha: 1 });
      }

      resetNodes() {
        this.data = JSON.parse(JSON.stringify(TOPOLOGIES[this.idx]));
        this.shockwaves = [];
      }

      animate() {
        if (this.autoRotate && !this.isDraggingBg && !this.draggedNode) {
          this.angleY += 0.004 * this.speed;
        }

        this.ctx.clearRect(0, 0, this.width, this.height);

        // Ondas de choque
        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const sw = this.shockwaves[i];
          sw.radius += 5 * this.speed;
          sw.alpha *= 0.94;

          this.ctx.beginPath();
          this.ctx.arc(this.width / 2, this.height / 2, sw.radius, 0, Math.PI * 2);
          this.ctx.strokeStyle = `rgba(${this.rgb[0]}, ${this.rgb[1]}, ${this.rgb[2]}, ${sw.alpha * 0.5})`;
          this.ctx.lineWidth = 2;
          this.ctx.stroke();

          if (sw.alpha < 0.02) this.shockwaves.splice(i, 1);
        }

        // Aristas
        this.data.links.forEach(([i, j]) => {
          const n1 = this.data.nodes[i];
          const n2 = this.data.nodes[j];
          if (!n1 || !n2) return;

          const p1 = this.project(n1);
          const p2 = this.project(n2);

          const isConnected = (this.hoveredNode && (this.hoveredNode.id === n1.id || this.hoveredNode.id === n2.id));

          this.ctx.beginPath();
          this.ctx.moveTo(p1.x, p1.y);
          this.ctx.lineTo(p2.x, p2.y);

          if (isConnected) {
            this.ctx.strokeStyle = `rgba(${this.rgb[0]}, ${this.rgb[1]}, ${this.rgb[2]}, 0.85)`;
            this.ctx.lineWidth = 2.5;
          } else {
            this.ctx.strokeStyle = `rgba(${this.rgb[0]}, ${this.rgb[1]}, ${this.rgb[2]}, 0.2)`;
            this.ctx.lineWidth = 1;
          }
          this.ctx.stroke();
        });

        // Nodos
        const sorted = [...this.data.nodes].map(n => ({ node: n, proj: this.project(n) }))
          .sort((a, b) => a.proj.z2 - b.proj.z2);

        sorted.forEach(({ node, proj }) => {
          const isHovered = this.hoveredNode && this.hoveredNode.id === node.id;
          const r = node.r * proj.scale * (isHovered ? 1.35 : 1);

          this.ctx.beginPath();
          this.ctx.arc(proj.x, proj.y, r * 1.8, 0, Math.PI * 2);
          this.ctx.fillStyle = `rgba(${this.rgb[0]}, ${this.rgb[1]}, ${this.rgb[2]}, ${isHovered ? 0.25 : 0.08})`;
          this.ctx.fill();

          this.ctx.beginPath();
          this.ctx.arc(proj.x, proj.y, r, 0, Math.PI * 2);
          const grad = this.ctx.createRadialGradient(
            proj.x - r * 0.3, proj.y - r * 0.3, r * 0.1,
            proj.x, proj.y, r
          );
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.5, `rgb(${this.rgb[0]}, ${this.rgb[1]}, ${this.rgb[2]})`);
          grad.addColorStop(1, `rgba(${this.rgb[0] * 0.6}, ${this.rgb[1] * 0.6}, ${this.rgb[2] * 0.6}, 1)`);
          this.ctx.fillStyle = grad;
          this.ctx.fill();

          this.ctx.font = `${Math.max(10, Math.floor(12 * proj.scale))}px "Space Grotesk", sans-serif`;
          this.ctx.fillStyle = isHovered ? '#0c121e' : '#5a6a85';
          this.ctx.textAlign = 'center';
          this.ctx.fillText(node.label, proj.x, proj.y + r + 13 * proj.scale);
        });

        requestAnimationFrame(() => this.animate());
      }
    }

    const STAGES = [];
    window.addEventListener('DOMContentLoaded', () => {
      for (let i = 0; i < 5; i++) {
        STAGES.push(new InteractiveStage(i));
      }
    });

    function triggerStagePulse(idx) {
      if (STAGES[idx]) STAGES[idx].triggerPulse();
    }

    function toggleAutoRotate(idx, btn) {
      if (STAGES[idx]) {
        STAGES[idx].autoRotate = !STAGES[idx].autoRotate;
        if (btn) btn.classList.toggle('active', STAGES[idx].autoRotate);
      }
    }

    function resetStageNodes(idx) {
      if (STAGES[idx]) STAGES[idx].resetNodes();
    }

    // ==========================================================================
    // 5. LIGHTBOX MODAL EN ALTA RESOLUCIÓN
    // ==========================================================================
    function openFullPlate(slideNum, captionText) {
      const modal = document.getElementById('lightboxModal');
      const img = document.getElementById('lightboxImg');
      const cap = document.getElementById('lightboxCaption');
      if (modal && img) {
        img.src = `./slides/slide_${slideNum}.png`;
        if (cap) cap.textContent = captionText || `Slide ${slideNum}`;
        modal.classList.add('active');
      }
    }

    function closeFullPlate(e) {
      const modal = document.getElementById('lightboxModal');
      if (modal) modal.classList.remove('active');
    }
  </script>
</body>
